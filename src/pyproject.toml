[project]
name = "displacebox"
version = "2.4.0"
description = "HTA map displace.bin file to raw/png GUI converter"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.12.0",
    "Pillow>=13.0.0",
    "requests>=2.34.2",
    "packaging>=23.0",
]

[project.scripts]
displacebox = "main:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["src_assets/**"]

[dependency-groups]
dev = [
    "nuitka>=2.0.0",
]

[tool.uv]
package = false